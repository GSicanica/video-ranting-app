kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.stability.nowarn=true
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true

# JVM - Optimized memory for faster builds
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=50 -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication

# Build optimizations
# Keep the local Gradle build cache disabled for Android Studio builds. DEX outputs
# in this project can disappear while Gradle is packing them, which makes tasks
# like :androidApp:mergeLibDexDebug fail during cache storage.
org.gradle.caching=false
# Parallel project execution is currently unstable with the KMP + KAPT setup in composeApp.
# Keep default builds deterministic until Room/KAPT is migrated or the module graph is simplified.
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true

# Additional performance optimizations
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
kotlin.compiler.execution.strategy=out-of-process
kotlin.compiler.keepAliveMode=jvm
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# File system watching for faster incremental builds
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

# Disable unused features for faster builds
org.gradle.warning.mode=none

# Android optimizations
android.enableJetifier=false
android.enableR8.fullMode=true
android.experimental.enableSourceSetPathsMap=true
android.experimental.cacheCompileLibResources=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.enableResourceOptimizations=true
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Performance optimizations for release builds
# (deprecated options removed)

# Suppress compileSdk warnings
android.suppressUnsupportedCompileSdk=35,36

# Centralized Android SDK versions (used by build-logic)
android.compileSdk=36
android.minSdk=24
android.targetSdk=35

# App version (single source of truth for androidApp + composeApp BuildConfig)
app.versionCode=100
app.versionName=10.0
