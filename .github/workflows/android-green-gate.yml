name: Android Green Gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: android-green-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Architecture check
        run: ./gradlew --no-daemon --stacktrace --configuration-cache productionArchitectureCheck

      - name: Android lint (release)
        run: ./gradlew --no-daemon --stacktrace --configuration-cache :androidApp:lintRelease

      - name: Android assemble (debug)
        run: ./gradlew --no-daemon --stacktrace --configuration-cache :androidApp:assembleDebug

